[project]
name = "alchemy-client"
version = "0.1.0"
description = "Fetch token holdings from Alchemy API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14.7"
dependencies = [
    "requests>=2.34.2",
    "python-dotenv>=1.2.3",
    "pendulum>=3.2.0",
    "transform-core",
]

[tool.uv.sources]
transform-core = { workspace = true }

[project.scripts]
alchemy-fetch = "alchemy_client:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.12.6"]
build-backend = "uv_build"