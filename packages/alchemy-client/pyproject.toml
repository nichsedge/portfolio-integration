[project]
name = "alchemy-client"
version = "0.1.0"
description = "Fetch token holdings from Alchemy API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pendulum>=3.0.0",
]

[project.scripts]
alchemy-fetch = "alchemy_client:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.12.0"]
build-backend = "uv_build"