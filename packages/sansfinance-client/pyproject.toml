[project]
name = "sansfinance-client"
version = "0.1.0"
description = "Fetch Sans Finance app data (accounts + portfolio DB) from Cloudflare R2"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pendulum>=3.0.0",
    "transform-core",
]

[tool.uv.sources]
transform-core = { workspace = true }

[project.scripts]
sansfinance-fetch = "sansfinance_client:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.12.0"]
build-backend = "uv_build"
