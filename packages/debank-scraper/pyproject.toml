[project]
name = "debank-scraper"
version = "0.1.0"
description = "DeBank scraper and data cleaner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debank_scraper"]

[project.scripts]
debank-scrape = "debank_scraper.debank:main"
