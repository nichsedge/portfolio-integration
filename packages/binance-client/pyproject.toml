[project]
name = "binance-client"
version = "0.1.0"
description = "Fetch cryptocurrency balances from Binance and similar exchanges using CCXT"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.0.0",
    "python-dotenv>=1.0.0",
    "pendulum>=3.0.0",
]

[project.scripts]
binance-fetch = "binance_client:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.12.0"]
build-backend = "uv_build"