[project]
name = "binance-client"
version = "0.1.0"
description = "Fetch cryptocurrency balances from Binance and similar exchanges using CCXT"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14.7"
dependencies = [
    "ccxt>=4.5.75",
    "python-dotenv>=1.2.3",
    "pendulum>=3.2.0",
    "transform-core",
]

[tool.uv.sources]
transform-core = { workspace = true }

[project.scripts]
binance-fetch = "binance_client:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.12.6"]
build-backend = "uv_build"