[project]
name = "binance-client"
version = "0.1.0"
description = "Fetch cryptocurrency balances from Binance and similar exchanges using CCXT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/binance"]

[project.scripts]
binance-fetch = "binance.ccxt_balance:main"