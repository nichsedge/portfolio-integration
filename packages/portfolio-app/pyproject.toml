[project]
name = "portfolio_app"
version = "0.1.0"
description = "Portfolio data integration and transformation"
readme = "README.md"
requires-python = ">=3.14.7"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pendulum>=3.2.0",
    "pandas>=2.3.3",
    "requests>=2.34.2",
    "matplotlib>=3.11.1",
    "transform-core",
    "rich>=15.0.0",
    "google-cloud-storage>=2.19.0",
    "pydantic>=2.13.4",
]

[project.scripts]
portfolio-mcp = "portfolio_app.mcp_server:main"
portfolio-ai-state = "portfolio_app.ai_state_generator:main"
portfolio-dashboard = "portfolio_app.dashboard:main"
portfolio-compact = "portfolio_app.snapshot_compactor:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.12.6"]
build-backend = "uv_build"

[tool.uv.sources]
transform-core = { workspace = true }
