[project]
name = "portfolio_app"
version = "0.1.0"
description = "Portfolio data integration and transformation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pendulum>=3.0.0",
    "pandas>=2.3.1",
    "requests>=2.31.0",
    "matplotlib>=3.10.8",
    "transform-core",
    "rich>=15.0.0",
    "google-cloud-storage>=2.14.0",
    "pydantic>=2.10.0",
]

[project.scripts]
portfolio-mcp = "portfolio_app.mcp_server:main"
portfolio-ai-state = "portfolio_app.ai_state_generator:main"
portfolio-dashboard = "portfolio_app.dashboard:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
transform-core = { workspace = true }
