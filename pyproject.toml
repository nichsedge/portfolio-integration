[tool.uv.workspace]
members = [
    "packages/*",
    "apps/*"
]

[tool.uv]
managed = true

[project]
name = "portfolio-integration"
version = "0.1.0"
description = "Unified financial portfolio ETL pipeline & MCP server aggregating KSEI, DeBank, Binance, and Alchemy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14.7"
dependencies = [
    "pipeline-runner",
    "portfolio-app",
    "binance-client",
    "alchemy-client",
    "transform-core",
    "sansfinance-client",
    "ksei",
    "debank-scraper",
    "pendulum>=3.2.0",
    "python-dotenv>=1.2.3",
    "pydantic>=2.13.4",
    "holidays>=0.103",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26.0",
]

[tool.uv.sources]
pipeline-runner = { workspace = true }
portfolio-app = { workspace = true }
binance-client = { workspace = true }
alchemy-client = { workspace = true }
transform-core = { workspace = true }
sansfinance-client = { workspace = true }
ksei = { git = "https://github.com/nichsedge/ksei.git" }
debank-scraper = { git = "https://github.com/nichsedge/debank-scraper.git" }

