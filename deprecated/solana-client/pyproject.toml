[project]
name = "solana-client"
version = "0.1.0"
description = "A Python client for fetching Solana token holdings and prices"
readme = "README.md"
requires-python = ">=3.14.7"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "solana>=0.40.2",
    "solders>=0.29.0",
    "requests>=2.34.2",
    "python-dotenv>=1.2.3",
    "pendulum>=3.2.0",
]

[project.scripts]
solana-fetch = "solana_client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solana_client"]
