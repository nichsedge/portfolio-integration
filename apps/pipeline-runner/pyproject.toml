[project]
name = "pipeline-runner"
version = "0.1.0"
description = "Pipeline runner for portfolio integration"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "your.email@example.com" }]
dependencies = [
    "portfolio-app",
    "ksei",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_runner"]

[tool.uv.sources]
portfolio-app = { workspace = true }
ksei = { git = "https://github.com/nichsedge/ksei.git" }

[project.scripts]
run-all = "pipeline_runner:main"
fetch-only = "pipeline_runner:fetch_entrypoint"
integrate-only = "pipeline_runner:integrate_entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
