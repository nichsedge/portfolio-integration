[project]
name = "pipeline-runner"
version = "0.1.0"
description = "Pipeline runner for portfolio integration"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "portfolio-app",
    "ksei",
    "debank-scraper",
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
portfolio-app = { workspace = true }
ksei = { git = "https://github.com/nichsedge/ksei.git" }
debank-scraper = { git = "https://github.com/nichsedge/debank-scraper.git" }

[project.scripts]
run-all = "pipeline_runner:main"
fetch-only = "pipeline_runner:fetch_entrypoint"
integrate-only = "pipeline_runner:integrate_entrypoint"

[build-system]
requires = ["uv_build>=0.9.26,<0.12.0"]
build-backend = "uv_build"
