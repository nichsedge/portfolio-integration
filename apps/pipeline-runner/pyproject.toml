[project]
name = "pipeline-runner"
version = "0.1.0"
description = "Pipeline runner for portfolio integration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "portfolio-app",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_runner"]

[tool.uv.sources]
portfolio-app = { workspace = true }

[project.scripts]
pipeline-runner = "pipeline_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
